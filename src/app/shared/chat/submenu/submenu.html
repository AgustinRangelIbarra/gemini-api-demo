<div (click)="$event.stopPropagation()" class="mx-3">
  <div class="rounded-xl bg-white p-2 border-gray-300 border-2 shadow-xl">
    <div class="flex items-center flex-col pb-2">
      <img src="svgs/pepsico_color.svg" alt="Pepsico logo"/>
    </div>
    <ul class="divide-y divide-gray-100">
      @for (model of availableModels; track $index) {
        <li
          (click)="modelSelection(model)"
          class="flex justify-between items-center py-2 px-3 hover:bg-gray-100 cursor-pointer rounded-lg"
        >
          <span class="text-sm font-medium text-gray-900">{{ model.name }}</span>
          <div class="size-2 rounded-full bg-emerald-500"></div>
        </li>
      }
    </ul>
  </div>
</div>
